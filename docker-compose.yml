services:
  postgres:
    image: postgres:16-alpine
    container_name: the-wedding-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-the_wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMePostgres!123}
      POSTGRES_USER: ${POSTGRES_USER:-the_wedding}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: the-wedding-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
