name: Deploy Docker VPS

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Container registry to push images to.
        required: true
        default: ghcr
        type: choice
        options:
          - ghcr
          - dockerhub
  push:
    branches:
      - main

env:
  CONTAINER_REGISTRY: ${{ github.event.inputs.registry || vars.CONTAINER_REGISTRY || 'ghcr' }}
  API_IMAGE_NAME: the-wedding-api
  WEB_IMAGE_NAME: the-wedding-web

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image namespace
        id: image-meta
        shell: bash
        run: |
          if [ "${CONTAINER_REGISTRY}" = "dockerhub" ]; then
            image_registry="docker.io"
            image_namespace="${{ secrets.DOCKERHUB_USERNAME }}"
          else
            image_registry="ghcr.io"
            image_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          fi
          echo "IMAGE_REGISTRY=$image_registry" >> "$GITHUB_ENV"
          echo "IMAGE_NAMESPACE=$image_namespace" >> "$GITHUB_ENV"
          echo "image_registry=$image_registry" >> "$GITHUB_OUTPUT"
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.CONTAINER_REGISTRY == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: env.CONTAINER_REGISTRY != 'dockerhub'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}

    outputs:
      image_registry: ${{ steps.image-meta.outputs.image_registry }}
      image_namespace: ${{ steps.image-meta.outputs.image_namespace }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Copy production compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REGISTRY: ${{ needs.build-and-push.outputs.image_registry }}
          IMAGE_NAMESPACE: ${{ needs.build-and-push.outputs.image_namespace }}
          VPS_REGISTRY_USERNAME: ${{ secrets.VPS_REGISTRY_USERNAME }}
          VPS_REGISTRY_TOKEN: ${{ secrets.VPS_REGISTRY_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_REGISTRY,IMAGE_NAMESPACE,VPS_REGISTRY_USERNAME,VPS_REGISTRY_TOKEN
          script_stop: true
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            test -f .env.production
            if [ -n "$VPS_REGISTRY_USERNAME" ] && [ -n "$VPS_REGISTRY_TOKEN" ]; then
              echo "$VPS_REGISTRY_TOKEN" | docker login "$IMAGE_REGISTRY" -u "$VPS_REGISTRY_USERNAME" --password-stdin
            fi
            IMAGE_REGISTRY="$IMAGE_REGISTRY" IMAGE_NAMESPACE="$IMAGE_NAMESPACE" IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.production -f docker-compose.prod.yml pull
            IMAGE_REGISTRY="$IMAGE_REGISTRY" IMAGE_NAMESPACE="$IMAGE_NAMESPACE" IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            docker image prune -f
