services:
  api:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/the-wedding-api:${IMAGE_TAG:-latest}
    container_name: the-wedding-api
    env_file:
      - .env.production
    ports:
      - '${API_PORT:-4000}:4000'
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - api-storage:/app/storage

  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/the-wedding-web:${IMAGE_TAG:-latest}
    container_name: the-wedding-web
    env_file:
      - .env.production
    ports:
      - '${WEB_PORT:-3000}:3000'
    restart: unless-stopped
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: the-wedding-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  api-storage:
  redis-data:
